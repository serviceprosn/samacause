<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png?v=4" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Sunu Yité - Plateforme web et mobile de mobilisation citoyenne et de financement participatif solidaire au Sénégal. Pétitions sécurisées par OTP SMS, transparence totale des dépenses, et dons via Wave, Orange Money et Stripe." />
    <meta name="theme-color" content="#00853F" />
    <meta name="application-name" content="Sunu Yité" />
    <meta name="apple-mobile-web-app-title" content="Sunu Yité" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.json?v=4" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=4" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon-precomposed.png?v=4" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=4" />
    
    <title>Sunu Yité | Mobilisation Citoyenne au Sénégal</title>
    <script>
      // Redirect vercel.app to custom domain sunuyite.fun
      if (window.location.hostname === 'sunuyite.vercel.app') {
        window.location.replace('https://sunuyite.fun' + window.location.pathname + window.location.search + window.location.hash);
      }

      // Register Firebase Messaging Service Worker for background push notifications
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/firebase-messaging-sw.js')
            .then(function(registration) {
              console.log('Firebase Service Worker registered successfully with scope:', registration.scope);
            })
            .catch(function(err) {
              console.warn('Firebase Service Worker registration failed:', err);
            });
        });
      }
      // Clear cache storage to remove cached API responses/assets
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          keys.forEach(function(key) {
            caches.delete(key);
          });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
